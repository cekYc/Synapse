[package]
name = "synapse"
version = "0.1.0"
description = "Next-gen Windows Automation & Macro Engine"
authors = ["cekyy"]
edition = "2021"

[lib]
name = "synapse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Phase 2: Core Engine
tokio = { version = "1", features = ["full"] }
enigo = { version = "0.3", features = [] }
rand = "0.9"
parking_lot = "0.12"

# Phase 5: Performance (GPU template matching, parallel CPU fallback)
# NOTE: wgpu-hal's DX12 backend needs `gpu-allocator` built against `windows`
# 0.62, but gpu-allocator accepts a range (>=0.53, <=0.62) and, with Tauri's
# 0.58/0.61 also in the graph, Cargo may resolve it to an older one. Cargo.lock
# pins that edge to 0.62.2. If the Windows build fails inside wgpu-hal/dx12
# after a `cargo update`, set gpu-allocator's `windows` entry in Cargo.lock back
# to "windows 0.62.2".
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan", "metal"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"

# Phase 7: Flow sharing (portable packages and share codes)
flate2 = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
# Phase 5: DXGI Desktop Duplication (COM interfaces need the `windows` crate)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
